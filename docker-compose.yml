services:
  caldav:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://kalendav:kalendav@db:5432/kalendav
      - SECRET_KEY=your-secret-key-change-in-production
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
      - VITE_DEV=true
    depends_on:
      - db
    volumes:
      - ./app:/app/app

  vite-dev:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app/app
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./vite.config.js:/app/vite.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=kalendav
      - POSTGRES_PASSWORD=kalendav
      - POSTGRES_DB=kalendav
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
