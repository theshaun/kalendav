{% extends "base.html" %}

{% block title %}Generate API Key{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/admin/api-keys" class="text-blue-600 hover:underline">&larr; Back to API Keys</a>
</div>

<div class="bg-white rounded-lg shadow p-6 max-w-lg">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Generate API Key</h1>
    
    {% if generated_key %}
    <div class="mb-6 p-4 bg-green-50 border border-green-200 rounded">
        <p class="text-green-800 font-medium mb-2">API Key Generated!</p>
        <p class="text-sm text-green-700 mb-3">Copy this key now. You won't be able to see it again.</p>
        <code class="block p-3 bg-white border rounded text-sm break-all">{{ generated_key }}</code>
    </div>
    {% endif %}
    
    <form action="/admin/api-keys/create" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input type="text" name="name" required placeholder="e.g., Mobile App" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">User</label>
            <select name="user_id" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                {% for u in users %}
                <option value="{{ u.id }}">{{ u.username }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Expires At (optional)</label>
            <input type="datetime-local" name="expires_at" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div class="pt-4">
            <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                {% if generated_key %}Generate Another Key{% else %}Generate Key{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
