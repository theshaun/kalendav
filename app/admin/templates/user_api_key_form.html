{% extends "user_base.html" %}
{% block title %}Create API Key{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/admin/my-api-keys" class="text-blue-600 dark:text-blue-400 hover:underline">&larr; Back to API Keys</a>
</div>

<div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 max-w-lg">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">Generate API Key</h1>
    
    {% if generated_key %}
    <div class="mb-6 p-4 bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-700 rounded">
        <p class="text-green-800 dark:text-green-200 font-medium mb-2">API Key Generated!</p>
        <p class="text-sm text-green-700 dark:text-green-300 mb-3">Copy this key now. You won't be able to see it again.</p>
        <code class="block p-3 bg-white dark:bg-gray-900 border dark:border-gray-600 rounded text-sm break-all text-gray-800 dark:text-gray-200">{{ generated_key }}</code>
    </div>
    {% endif %}
    
    <form action="/admin/my-api-keys/create" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name</label>
            <input type="text" name="name" required placeholder="e.g., Mobile App" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Expires At (optional)</label>
            <input type="datetime-local" name="expires_at" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div class="pt-4">
            <button type="submit" class="w-full bg-blue-600 dark:bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-700 dark:hover:bg-blue-600">
                {% if generated_key %}Generate Another Key{% else %}Generate Key{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
