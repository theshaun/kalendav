{% extends "user_base.html" %}
{% block title %}My Dashboard{% endblock %}
{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100">My Dashboard</h1>
    <p class="text-gray-600 dark:text-gray-400 mt-2">Welcome, {{ user.username }}!</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100">{{ calendars_count }} Calendars</h2>
        <a href="/admin/my-calendars" class="text-blue-600 dark:text-blue-400 hover:underline">Manage</a>
    </div>
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100">{{ api_keys_count }} API Keys</h2>
        <a href="/admin/my-api-keys" class="text-blue-600 dark:text-blue-400 hover:underline">Manage</a>
    </div>
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100">{{ events_count }} Events</h2>
    </div>
</div>
{% endblock %}
