<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" onclick="if(event.target === this) closeModal()">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-800 dark:text-white">
                    {% if is_new %}New Event{% else %}Edit Event{% endif %}
                </h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form id="event-form"
                hx-{% if is_new %}post{% else %}put{% endif %}="/admin/calendar/events{% if not is_new %}/{{ event.id }}{% endif %}"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                class="space-y-4">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Calendar</label>
                    <select name="calendar_id" required
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                        {% for cal in calendars %}
                        <option value="{{ cal.id }}" {% if event and event.calendar_id == cal.id %}selected{% endif %}>
                            {{ cal.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Title</label>
                    <input type="text" name="summary" required
                        value="{{ event.summary if event else '' }}"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div class="flex items-center gap-2">
                    <input type="checkbox" name="is_all_day" id="is_all_day" 
                        {% if event and event.is_all_day %}checked{% endif %}
                        onchange="toggleAllDay(this.checked)"
                        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="is_all_day" class="text-sm text-gray-700 dark:text-gray-300">All day</label>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Start</label>
                        <input type="datetime-local" name="dtstart" id="dtstart" required
                            value="{% if event %}{{ event.dtstart.strftime('%Y-%m-%dT%H:%M') }}{% elif default_start %}{{ default_start }}{% elif default_date %}{{ default_date }}T09:00{% else %}{% endif %}"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">End</label>
                        <input type="datetime-local" name="dtend" id="dtend"
                            value="{% if event and event.dtend %}{{ event.dtend.strftime('%Y-%m-%dT%H:%M') }}{% elif default_end %}{{ default_end }}{% endif %}"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Location</label>
                    <input type="text" name="location"
                        value="{{ event.location if event else '' }}"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
                    <textarea name="description" rows="3"
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">{{ event.description if event else '' }}</textarea>
                </div>
                
                <div class="border-t dark:border-gray-700 pt-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Repeat</label>
                    <div class="grid grid-cols-2 gap-4">
                        <select name="rrule_freq" id="rrule_freq" onchange="toggleRecurrenceOptions()"
                            class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                            <option value="none" {% if not event or not event.rrule %}selected{% endif %}>Does not repeat</option>
                            <option value="daily" {% if event and event.rrule and 'DAILY' in event.rrule %}selected{% endif %}>Daily</option>
                            <option value="weekly" {% if event and event.rrule and 'WEEKLY' in event.rrule %}selected{% endif %}>Weekly</option>
                            <option value="monthly" {% if event and event.rrule and 'MONTHLY' in event.rrule %}selected{% endif %}>Monthly</option>
                            <option value="yearly" {% if event and event.rrule and 'YEARLY' in event.rrule %}selected{% endif %}>Yearly</option>
                        </select>
                        <div id="rrule-interval-container" class="hidden">
                            <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Every</label>
                            <div class="flex items-center gap-2">
                                <input type="number" name="rrule_interval" min="1" value="1"
                                    class="w-20 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-blue-500 focus:border-blue-500">
                                <span id="interval-label" class="text-sm text-gray-600 dark:text-gray-400">days</span>
                            </div>
                        </div>
                    </div>
                    
                    <div id="rrule-end-container" class="mt-3 hidden">
                        <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Ends</label>
                        <div class="flex gap-4">
                            <label class="flex items-center gap-2">
                                <input type="radio" name="rrule_end_type" value="never" checked
                                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <span class="text-sm text-gray-700 dark:text-gray-300">Never</span>
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="radio" name="rrule_end_type" value="count"
                                    onchange="document.getElementById('rrule_count_input').focus()"
                                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <span class="text-sm text-gray-700 dark:text-gray-300">After</span>
                                <input type="number" name="rrule_count" id="rrule_count_input" min="1" value="10"
                                    class="w-16 px-2 py-1 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm">
                                <span class="text-sm text-gray-700 dark:text-gray-300">times</span>
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="radio" name="rrule_end_type" value="until"
                                    onchange="document.getElementById('rrule_until_input').focus()"
                                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <span class="text-sm text-gray-700 dark:text-gray-300">On</span>
                                <input type="date" name="rrule_until" id="rrule_until_input"
                                    class="px-2 py-1 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm">
                            </label>
                        </div>
                    </div>
                </div>
                
                <input type="hidden" name="tz" id="event-tz">
                
                <div class="flex justify-between pt-4">
                    <div>
                        {% if not is_new %}
                        <button type="button" onclick="deleteEvent({{ event.id }})"
                            class="px-4 py-2 text-red-600 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 font-medium">
                            Delete
                        </button>
                        {% endif %}
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="closeModal()"
                            class="px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md">
                            Cancel
                        </button>
                        <button type="submit"
                            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium">
                            {% if is_new %}Create{% else %}Save{% endif %}
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('event-tz').value = Intl.DateTimeFormat().resolvedOptions().timeZone;
    
    function toggleAllDay(isAllDay) {
        const dtstart = document.getElementById('dtstart');
        const dtend = document.getElementById('dtend');
        
        if (isAllDay) {
            const startDate = dtstart.value.split('T')[0];
            const endDate = dtend.value ? dtend.value.split('T')[0] : '';
            
            dtstart.type = 'date';
            dtend.type = 'date';
            
            dtstart.value = startDate;
            if (endDate) {
                dtend.value = endDate;
            }
        } else {
            const startDate = dtstart.value.split('T')[0];
            const endDate = dtend.value ? dtend.value.split('T')[0] : '';
            
            dtstart.type = 'datetime-local';
            dtend.type = 'datetime-local';
            
            dtstart.value = startDate + 'T09:00';
            if (endDate) {
                dtend.value = endDate + 'T10:00';
            }
        }
    }
    
    function toggleRecurrenceOptions() {
        const freq = document.getElementById('rrule_freq').value;
        const intervalContainer = document.getElementById('rrule-interval-container');
        const endContainer = document.getElementById('rrule-end-container');
        const intervalLabel = document.getElementById('interval-label');
        
        if (freq === 'none') {
            intervalContainer.classList.add('hidden');
            endContainer.classList.add('hidden');
        } else {
            intervalContainer.classList.remove('hidden');
            endContainer.classList.remove('hidden');
            
            const labels = {
                'daily': 'days',
                'weekly': 'weeks',
                'monthly': 'months',
                'yearly': 'years'
            };
            intervalLabel.textContent = labels[freq];
        }
    }
    
    function deleteEvent(eventId) {
        if (confirm('Are you sure you want to delete this event?')) {
            fetch(`/admin/calendar/events/${eventId}`, {
                method: 'DELETE',
                headers: {
                    'Request-Method': 'DELETE'
                }
            }).then(response => response.text()).then(html => {
                document.getElementById('modal-container').innerHTML = html;
            });
        }
    }
    
    toggleRecurrenceOptions();
    
    {% if event and event.is_all_day %}
    toggleAllDay(true);
    {% endif %}
</script>
