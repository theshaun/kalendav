{% extends "user_base.html" %}
{% block title %}{% if calendar %}Edit Calendar{% else %}Create Calendar{% endif %}{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/admin/my-calendars" class="text-blue-600 dark:text-blue-400 hover:underline">&larr; Back to My Calendars</a>
</div>

<div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 max-w-lg">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">{% if calendar %}Edit Calendar{% else %}Create Calendar{% endif %}</h1>
    
    <form action="/admin/my-calendars/{% if calendar %}{{ calendar.id }}/edit{% else %}create{% endif %}" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name</label>
            <input type="text" name="name" required value="{% if calendar %}{{ calendar.name }}{% endif %}" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
            <textarea name="description" rows="3" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">{% if calendar %}{{ calendar.description or '' }}{% endif %}</textarea>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Color</label>
            <input type="color" name="color" value="{% if calendar %}{{ calendar.color }}{% else %}#3B82F6{% endif %}" class="w-full h-10 px-1 py-1 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div class="pt-4">
            <button type="submit" class="w-full bg-blue-600 dark:bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-700 dark:hover:bg-blue-600">
                {% if calendar %}Save Changes{% else %}Create Calendar{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
