{% extends "base.html" %}

{% block title %}{% if edit_user %}Edit User{% else %}Create User{% endif %}{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/admin/users" class="text-blue-600 dark:text-blue-400 hover:underline">&larr; Back to Users</a>
</div>

<div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 max-w-lg">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-6">
        {% if edit_user %}Edit User{% else %}Create User{% endif %}
    </h1>
    
    <form action="/admin/users/{% if edit_user %}{{ edit_user.id }}/edit{% else %}create{% endif %}" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
            {% if edit_user %}
            <input type="text" value="{{ edit_user.username }}" disabled class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
            {% else %}
            <input type="text" name="username" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
            {% endif %}
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
            <input type="email" name="email" value="{{ edit_user.email if edit_user else '' }}" required class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password {% if edit_user %}(leave blank to keep){% endif %}</label>
            <input type="password" name="password" {% if not edit_user %}required{% endif %} class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <div class="flex items-center">
            <input type="checkbox" name="is_admin" id="is_admin" {% if edit_user and edit_user.is_admin %}checked{% endif %} class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700">
            <label for="is_admin" class="ml-2 text-sm text-gray-700 dark:text-gray-300">Administrator</label>
        </div>
        
        <div class="pt-4">
            <button type="submit" class="w-full bg-blue-600 dark:bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-700 dark:hover:bg-blue-600">
                {% if edit_user %}Update User{% else %}Create User{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
